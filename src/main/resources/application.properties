spring.application.name=oddBNB-Server
jwt.secret=${JWT_SECRET}
# --- MySQL Connection ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# MySQL dialect (optional ? Boot often detects automatically)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.security=DEBUG


aws.region=us-east-1

app.seed.demo-listings=${APP_SEED_DEMO_LISTINGS:false}
app.seed.demo-user-email=${APP_SEED_DEMO_USER_EMAIL:test@email.com}
app.seed.demo-user-password=${APP_SEED_DEMO_USER_PASSWORD:test1234}
app.seed.demo-user-first-name=${APP_SEED_DEMO_USER_FIRST_NAME:Test}
app.seed.demo-user-last-name=${APP_SEED_DEMO_USER_LAST_NAME:Host}
